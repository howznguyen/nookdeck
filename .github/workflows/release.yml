name: Release

# Push a tag like v0.2.0 (it must match "version" in package.json) to build and publish a release.
# Run it by hand (Actions > Release > Run workflow) for a dry run: the same builds, tests and signing as a tag build, then every asset
# is kept as a workflow artifact and NOTHING is published (no release, no tag). `publish` only runs for a pushed tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build everything, publish nothing (a manual run never publishes, whatever this says)"
        type: boolean
        default: true

# read-only by default; only `publish` (tags only) gets write access
permissions:
  contents: read

jobs:
  # The same tests on Windows: platform-neutral logic, the win32 builders and the real helper / Credential Manager calls.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  # The same tests on Linux (spec linux-support L1, AC-9): what needs macOS or Windows skips itself.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  # the Linux agent (spec linux-support L1): x64 and arm64, built on Linux, with their gzip copies and their own sums file.
  # `publish` puts them in SHA256SUMS; setup.sh and `nookdeck update` on Linux look for nookdeck-linux-<arch>(.gz).
  linux-cli:
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release version (the tag on a tag build, package.json on a manual run)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)"; fi
          [ -n "$v" ] || { echo "::error::no version"; exit 1; }
          echo "RELEASE_VERSION=$v" >> "$GITHUB_ENV"
          echo "version $v"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Linux x64 + arm64)
        run: |
          mkdir -p dist
          bun scripts/ensure-icons.ts
          bun scripts/ensure-web.ts
          # not macOS: writes the stub, so no Now Playing adapter is embedded
          bun scripts/build-mediaremote.ts
          bun run gen-assets
          for arch in x64 arm64; do
            bun build src/index.ts --compile --target="bun-linux-$arch" --outfile "dist/nookdeck-linux-$arch"
          done

      - name: The x64 binary reports the tagged version
        run: |
          got="$(./dist/nookdeck-linux-x64 --version)"
          [ "${got%% (*}" = "nookdeck $RELEASE_VERSION" ] || { echo "::error::binary printed '$got'"; exit 1; }

      - name: Gzip copies and their sums
        run: |
          cd dist
          for f in nookdeck-linux-x64 nookdeck-linux-arm64; do gzip -9 -n -k "$f"; done
          sha256sum nookdeck-linux-x64 nookdeck-linux-arm64 nookdeck-linux-x64.gz nookdeck-linux-arm64.gz > SHA256SUMS.linux
          cat SHA256SUMS.linux
          ls -l nookdeck-linux-*

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          retention-days: 3
          path: |
            dist/nookdeck-linux-x64
            dist/nookdeck-linux-arm64
            dist/nookdeck-linux-x64.gz
            dist/nookdeck-linux-arm64.gz
            dist/SHA256SUMS.linux

  # the Linux packages (spec linux-support L7, L9): .deb and .rpm from nfpm, plus a tarball, for amd64 and arm64.
  # Each holds the tray app (/usr/bin/nookdeck-tray) and the agent (/usr/lib/nookdeck/nookdeck); no system service.
  # Like the Windows and macOS apps, a failure here does not hold back the CLI release (publish attaches what was built).
  linux-packages:
    needs: linux-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release version (the tag on a tag build, package.json on a manual run)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)"; fi
          [ -n "$v" ] || { echo "::error::no version"; exit 1; }
          echo "RELEASE_VERSION=$v" >> "$GITHUB_ENV"
          echo "version $v"

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: Install nfpm
        # nfpm needs a newer Go than the tray app may pin: GOTOOLCHAIN=auto fetches it
        run: |
          GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
          nfpm --version

      - uses: actions/download-artifact@v4
        with:
          name: linux-cli
          path: cli

      - name: Build the tray app (linux/amd64 + linux/arm64, CGO_ENABLED=0)
        # build.sh copies the shared strings and icons into the module, runs `go test ./internal/...` (once), then go build
        run: |
          NOOKDECK_VERSION="$RELEASE_VERSION" sh apps/desktop/build.sh linux amd64 "$PWD/tray/amd64"
          NOOKDECK_VERSION="$RELEASE_VERSION" SKIP_TESTS=1 sh apps/desktop/build.sh linux arm64 "$PWD/tray/arm64"
          for arch in amd64 arm64; do test -x "tray/$arch/nookdeck-tray" && file "tray/$arch/nookdeck-tray"; done

      - name: Build the packages
        run: |
          chmod +x cli/nookdeck-linux-x64 cli/nookdeck-linux-arm64
          NOOKDECK_VERSION="$RELEASE_VERSION" sh scripts/package-linux.sh amd64 cli/nookdeck-linux-x64 tray/amd64/nookdeck-tray dist
          NOOKDECK_VERSION="$RELEASE_VERSION" sh scripts/package-linux.sh arm64 cli/nookdeck-linux-arm64 tray/arm64/nookdeck-tray dist

      - name: Check the .deb (contents, recommends, no maintainer scripts) and the tarball
        run: |
          deb="dist/nookdeck_${RELEASE_VERSION}_amd64.deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | tee contents.txt
          for p in ./usr/bin/nookdeck-tray ./usr/lib/nookdeck/nookdeck ./usr/share/applications/dev.nookdeck.app.desktop ./usr/share/icons/hicolor/scalable/apps/dev.nookdeck.app.svg; do
            grep -q " $p$" contents.txt || { echo "::error::$p is not in the .deb"; exit 1; }
          done
          dpkg-deb -f "$deb" Recommends | grep -q gnome-shell-extension-appindicator
          if dpkg-deb -f "$deb" Depends | grep -q .; then echo "::error::the .deb has hard Depends"; exit 1; fi
          mkdir ctl && dpkg-deb -e "$deb" ctl && if ls ctl | grep -qE '^(pre|post)(inst|rm)$'; then echo "::error::the .deb has maintainer scripts"; exit 1; fi
          tar -tzf dist/nookdeck-linux-x64.tar.gz | grep -qx 'nookdeck/agent/nookdeck'
          tar -tzf dist/nookdeck-linux-x64.tar.gz | grep -qx 'nookdeck/nookdeck-tray'

      - name: Sums of the packages
        run: |
          cd dist
          sha256sum nookdeck_*_amd64.deb nookdeck_*_arm64.deb nookdeck-*.x86_64.rpm nookdeck-*.aarch64.rpm nookdeck-linux-x64.tar.gz nookdeck-linux-arm64.tar.gz > SHA256SUMS.linux-packages
          cat SHA256SUMS.linux-packages

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          retention-days: 3
          path: |
            dist/nookdeck_*.deb
            dist/nookdeck-*.rpm
            dist/nookdeck-linux-*.tar.gz
            dist/SHA256SUMS.linux-packages

  # builds, tests and signs every CLI asset, then hands them to the app jobs and to `publish` as an artifact
  release:
    needs: [test-windows, test-linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release version (the tag on a tag build, package.json on a manual run)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)"; fi
          [ -n "$v" ] || { echo "::error::no version"; exit 1; }
          echo "RELEASE_VERSION=$v" >> "$GITHUB_ENV"
          echo "version $v"

      - name: The tag must match package.json
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # builds the web apps, the icon catalog and src/assets.gen.ts first, then runs every test
      - name: Test
        run: bun run test

      # the demo deck (the real deck, no agent): nookdeck.app fetches it at build time to render theme previews
      - name: Build the demo deck (nookdeck-demo.tgz)
        run: |
          mkdir -p dist
          (cd web/deck && bun install --frozen-lockfile && bun run build:demo)
          tar -czf dist/nookdeck-demo.tgz -C web/deck/dist-demo .
          ls -l dist/nookdeck-demo.tgz

      - name: Build (macOS arm64 + x64), cross-compile Windows x64
        run: |
          mkdir -p dist
          # the Now Playing adapter (vendor/mediaremote-adapter): a universal dylib, embedded into every binary below
          bun scripts/build-mediaremote.ts
          bun run gen-assets
          for arch in arm64 x64; do
            bun build src/index.ts src/platform/mac-worker.ts --compile --target="bun-darwin-$arch" --outfile "dist/nookdeck-darwin-$arch"
          done
          bun build src/index.ts --compile --target=bun-windows-x64 --outfile dist/nookdeck-windows-x64.exe

      # a stable self-signed identity: the designated requirement is the same for every release, so Accessibility grants survive updates.
      # The secrets exist only for this step; a release never ships ad hoc (scripts/sign-macos.ts fails when the mode is not "ci").
      - name: Sign the macOS binaries
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          NOOKDECK_REQUIRE_CI_SIGNING: "1"
        run: |
          for arch in arm64 x64; do bun scripts/sign-macos.ts "dist/nookdeck-darwin-$arch"; done

      - name: Old-name copies, gzip copies and SHA256SUMS
        run: |
          cd dist
          # R2: for the transition the same binaries are also published under the old names, because 0.1.x updaters only look for phonedesk-* (dropped around 0.4)
          for f in nookdeck-darwin-arm64 nookdeck-darwin-x64 nookdeck-windows-x64.exe; do cp "$f" "${f/nookdeck/phonedesk}"; done
          # gzip copies (about a third of the size): the installers prefer them and unpack + verify the binary too
          for f in nookdeck-darwin-arm64 nookdeck-darwin-x64 nookdeck-windows-x64.exe phonedesk-darwin-arm64 phonedesk-darwin-x64 phonedesk-windows-x64.exe; do gzip -9 -n -k "$f"; done
          shasum -a 256 nookdeck-darwin-arm64 nookdeck-darwin-x64 nookdeck-windows-x64.exe nookdeck-darwin-arm64.gz nookdeck-darwin-x64.gz nookdeck-windows-x64.exe.gz phonedesk-darwin-arm64 phonedesk-darwin-x64 phonedesk-windows-x64.exe phonedesk-darwin-arm64.gz phonedesk-darwin-x64.gz phonedesk-windows-x64.exe.gz > SHA256SUMS
          shasum -a 256 nookdeck-demo.tgz >> SHA256SUMS
          cat SHA256SUMS
          ls -l nookdeck-* phonedesk-*

      - name: The arm64 binary reports the tagged version
        run: |
          got="$(./dist/nookdeck-darwin-arm64 --version)"
          [ "${got%% (*}" = "nookdeck $RELEASE_VERSION" ] || { echo "::error::binary printed '$got'"; exit 1; }

      - name: The old-name binary answers the way 0.1.x updaters expect
        run: |
          got="$(./dist/phonedesk-darwin-arm64 --version)"
          [ "${got%% (*}" = "phonedesk $RELEASE_VERSION" ] || { echo "::error::old-name binary printed '$got'"; exit 1; }

      - name: Keep the CLI assets for the app jobs and the release
        uses: actions/upload-artifact@v4
        with:
          name: cli-assets
          retention-days: 3
          path: |
            dist/nookdeck-darwin-arm64
            dist/nookdeck-darwin-x64
            dist/nookdeck-windows-x64.exe
            dist/nookdeck-darwin-arm64.gz
            dist/nookdeck-darwin-x64.gz
            dist/nookdeck-windows-x64.exe.gz
            dist/phonedesk-darwin-arm64
            dist/phonedesk-darwin-x64
            dist/phonedesk-windows-x64.exe
            dist/phonedesk-darwin-arm64.gz
            dist/phonedesk-darwin-x64.gz
            dist/phonedesk-windows-x64.exe.gz
            dist/nookdeck-demo.tgz
            dist/SHA256SUMS

  # Nookdeck-Setup.exe (spec desktop-apps A4): the Go tray app + the agent above, in a per-user Inno Setup installer
  windows-app:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: cli-assets
          path: cli

      - name: Release version (the tag on a tag build, package.json on a manual run)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)"; fi
          [ -n "$v" ] || { echo "::error::no version"; exit 1; }
          echo "RELEASE_VERSION=$v" >> "$GITHUB_ENV"
          echo "version $v"

      - name: Build the tray app (tests, then Nookdeck.exe)
        shell: bash
        run: |
          NOOKDECK_VERSION="$RELEASE_VERSION" bash apps/desktop/build.sh apps/desktop/dist

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Nookdeck-Setup.exe
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $agent = (Resolve-Path cli/nookdeck-windows-x64.exe).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "/DDistDir=$((Resolve-Path apps/desktop/dist).Path)" "/DAgentExe=$agent" "/DSharedDir=$((Resolve-Path apps/shared).Path)" apps/desktop/installer/nookdeck.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }
          Get-Item apps/desktop/dist/Nookdeck-Setup.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          retention-days: 3
          path: apps/desktop/dist/Nookdeck-Setup.exe

  # Nookdeck.dmg (spec desktop-apps A3), built by scripts/build-macos-app.ts and signed with the same release identity as the CLI
  mac-app:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # dmgbuild (pinned in scripts/build-macos-app.ts) runs through uv; it writes the DMG window layout without Finder
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"

      - uses: actions/download-artifact@v4
        with:
          name: cli-assets
          path: cli

      - name: Prerequisites of the app build
        run: |
          bun scripts/ensure-icons.ts
          bun run build:web
          bun scripts/build-mediaremote.ts
          bun run gen-assets

      - name: Build, sign and pack Nookdeck.dmg
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          NOOKDECK_REQUIRE_CI_SIGNING: "1"
        run: |
          # the same (already signed) agent programs the CLI release ships: the app bundles exactly them
          chmod +x cli/nookdeck-darwin-arm64 cli/nookdeck-darwin-x64
          bun scripts/build-macos-app.ts --agent-arm64 cli/nookdeck-darwin-arm64 --agent-x64 cli/nookdeck-darwin-x64
          ls -l dist/macos

      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          retention-days: 3
          path: |
            dist/macos/Nookdeck.dmg
            dist/macos/Nookdeck.dmg.sha256

  # Nookdeck.apk (spec android-app-and-usb-setup): built with -PnookdeckVersion and signed with the owner's release key from the
  # ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets. Without the key no APK is
  # made at all (a debug-signed app must never ship): the release goes out without it and the agent says this release has no app.
  android-app:
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release version (the tag on a tag build, package.json on a manual run)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)"; fi
          [ -n "$v" ] || { echo "::error::no version"; exit 1; }
          echo "RELEASE_VERSION=$v" >> "$GITHUB_ENV"
          echo "version $v"

      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::no Android release key (secret ANDROID_KEYSTORE_BASE64): no Nookdeck.apk in this release"
            echo "ANDROID_SIGN=0" >> "$GITHUB_ENV"; exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_SIGN=1" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: env.ANDROID_SIGN == '1'
        with:
          distribution: temurin
          java-version: "17"

      # AGP 8.7 needs Gradle 8.9 or newer; the project has no wrapper, so the version is pinned here
      - uses: gradle/actions/setup-gradle@v4
        if: env.ANDROID_SIGN == '1'
        with:
          gradle-version: "8.11.1"

      - name: Android SDK parts
        if: env.ANDROID_SIGN == '1'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build and sign Nookdeck.apk
        if: env.ANDROID_SIGN == '1'
        env:
          NOOKDECK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOOKDECK_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOOKDECK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          export NOOKDECK_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          gradle -p apps/android --no-daemon -q assembleRelease -PnookdeckVersion="$RELEASE_VERSION"
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --print-certs "$apk" > certs.txt
          # the gradle file falls back to the debug key when the keystore is missing: refuse that here
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::Nookdeck.apk is signed with the debug key"; exit 1; fi
          grep -m1 "certificate SHA-256 digest" certs.txt
          mkdir -p dist && cp "$apk" dist/Nookdeck.apk && ls -l dist

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        if: env.ANDROID_SIGN == '1'
        with:
          name: android-app
          retention-days: 3
          path: dist/Nookdeck.apk

  publish:
    # an app job that fails (red in the run) must not hold back the CLI release: whatever was built is attached.
    # The Linux agent is a CLI asset like the others: no release without it.
    needs: [release, linux-cli, linux-packages, windows-app, mac-app, android-app]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.release.result == 'success' && needs.linux-cli.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add the Linux agent and the apps to SHA256SUMS (the tray app's updater checks Nookdeck-Setup.exe against it)
        run: |
          cd dist
          cat SHA256SUMS.linux >> SHA256SUMS && rm SHA256SUMS.linux
          if [ -f SHA256SUMS.linux-packages ]; then cat SHA256SUMS.linux-packages >> SHA256SUMS && rm SHA256SUMS.linux-packages
          else echo "::warning::the Linux packages were not built; the release goes out without them"; fi
          for f in Nookdeck.dmg Nookdeck-Setup.exe Nookdeck.apk; do
            if [ -f "$f" ]; then sha256sum "$f" >> SHA256SUMS; else echo "::warning::$f was not built; the release goes out without it"; fi
          done
          cat SHA256SUMS
          ls -l

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only this version's notes (plus Install and Files): the file keeps every version, a release shows its own
          sh scripts/release-body.sh "$GITHUB_REF_NAME" > release-body.md
          grep -q "^## Nookdeck ${GITHUB_REF_NAME#v}" release-body.md || { echo "no notes for $GITHUB_REF_NAME in .github/release-notes.md"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/nookdeck-darwin-arm64 dist/nookdeck-darwin-x64 dist/nookdeck-windows-x64.exe dist/nookdeck-linux-x64 dist/nookdeck-linux-arm64 dist/nookdeck-darwin-arm64.gz dist/nookdeck-darwin-x64.gz dist/nookdeck-windows-x64.exe.gz dist/nookdeck-linux-x64.gz dist/nookdeck-linux-arm64.gz dist/phonedesk-darwin-arm64 dist/phonedesk-darwin-x64 dist/phonedesk-windows-x64.exe dist/phonedesk-darwin-arm64.gz dist/phonedesk-darwin-x64.gz dist/phonedesk-windows-x64.exe.gz dist/nookdeck-demo.tgz dist/SHA256SUMS $(ls dist/Nookdeck.dmg dist/Nookdeck.dmg.sha256 dist/Nookdeck-Setup.exe dist/Nookdeck.apk dist/nookdeck_*.deb dist/nookdeck-*.rpm dist/nookdeck-linux-*.tar.gz 2>/dev/null) \
            --repo "$GITHUB_REPOSITORY" --title "Nookdeck $GITHUB_REF_NAME" --notes-file release-body.md --generate-notes

  # manual runs only: every asset in one artifact, SHA256SUMS completed the way `publish` does it. Creates no release and no tag.
  dry-run-bundle:
    needs: [release, linux-cli, linux-packages, windows-app, mac-app, android-app]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add the Linux agent and the apps to SHA256SUMS
        run: |
          cd dist
          if [ -f SHA256SUMS.linux ]; then cat SHA256SUMS.linux >> SHA256SUMS && rm SHA256SUMS.linux; else echo "::warning::the Linux agent was not built"; fi
          if [ -f SHA256SUMS.linux-packages ]; then cat SHA256SUMS.linux-packages >> SHA256SUMS && rm SHA256SUMS.linux-packages; else echo "::warning::the Linux packages were not built"; fi
          for f in Nookdeck.dmg Nookdeck-Setup.exe Nookdeck.apk; do
            if [ -f "$f" ]; then sha256sum "$f" >> SHA256SUMS; else echo "::warning::$f was not built"; fi
          done
          cat SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-release
          retention-days: 7
          path: dist/*
